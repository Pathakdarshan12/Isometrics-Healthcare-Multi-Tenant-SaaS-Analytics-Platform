version: 2

models:

  - name: stg_healthcare__hospitals
    description: >
      Hospital master data (tenants).
      Each hospital is a separate tenant with isolated data.
    config:
      meta:
        contains_phi: false
    columns:
      - name: hospital_id
        description: "🔒 Unique hospital identifier (tenant ID)"
        tests:
          - not_null
          - unique
      - name: hospital_name
        tests:
          - not_null
      - name: contract_tier
        tests:
          - accepted_values:
              arguments:
                values: ['Basic', 'Advanced', 'Enterprise']


  - name: stg_healthcare__patients
    description: >
      ⚠️ PHI WARNING: Patient demographics (partially de-identified).
      Names and MRN remain in raw layer only.
    config:
      meta:
        contains_phi: true
        phi_fields: ['date_of_birth', 'zip_code_3digit']
    columns:
      - name: patient_id
        description: "De-identified patient ID"
        tests:
          - not_null
      - name: hospital_id
        description: "🔒 CRITICAL: Hospital identifier for RLS"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_healthcare__hospitals')
                field: hospital_id
      - name: age_years
        description: "Current age in years"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 120
      - name: age_group
        tests:
          - accepted_values:
              arguments:
                values: ['Pediatric', 'Adult', 'Geriatric', 'Unknown']


  - name: stg_healthcare__providers
    description: "Provider roster - physicians, nurses, specialists"
    config:
      meta:
        contains_phi: false
    columns:
      - name: provider_id
        tests:
          - not_null
          - unique
      - name: hospital_id
        description: "🔒 CRITICAL for RLS"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_healthcare__hospitals')
                field: hospital_id
      - name: npi
        description: "National Provider Identifier"
        tests:
          - not_null


  - name: stg_healthcare__facilities
    description: "Facility/department master data"
    columns:
      - name: facility_id
        tests:
          - not_null
          - unique
      - name: hospital_id
        description: "🔒 CRITICAL for RLS"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_healthcare__hospitals')
                field: hospital_id


  - name: stg_healthcare__encounters
    description: >
      ⚠️ PHI WARNING: Patient encounters (admissions/visits).
      Primary fact table for healthcare analytics.
    config:
      meta:
        contains_phi: true
        phi_fields: ['admission_date', 'discharge_date']
    columns:
      - name: encounter_id
        description: "Unique encounter identifier"
        tests:
          - not_null
          - unique
      - name: hospital_id
        description: "🔒 CRITICAL for RLS"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_healthcare__hospitals')
                field: hospital_id
      - name: patient_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_healthcare__patients')
                field: patient_id
      - name: provider_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_healthcare__providers')
                field: provider_id
      - name: encounter_type
        tests:
          - accepted_values:
              arguments:
                values: ['Inpatient', 'Outpatient', 'Emergency', 'Observation']
      - name: length_of_stay
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 365
      - name: total_charges
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_healthcare__billing_transactions
    description: "Billing and payment transactions"
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: encounter_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_healthcare__encounters')
                field: encounter_id
      - name: patient_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_healthcare__patients')
                field: patient_id
      - name: hospital_id
        description: "🔒 CRITICAL for RLS"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_healthcare__hospitals')
                field: hospital_id

  - name: stg_healthcare__clinical_orders
    description: >
      Clinical orders for labs, radiology, medications, and procedures.
      Tracks order lifecycle from placement to completion.
    config:
      meta:
        contains_phi: true
        phi_fields: ['order_datetime', 'scheduled_datetime', 'completed_datetime']
        owner: "clinical-data-team@company.com"
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: hospital_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_healthcare__hospitals')
                field: hospital_id
      - name: order_type
        tests:
          - accepted_values:
              arguments:
                values: ['LAB', 'RADIOLOGY', 'MEDICATION', 'PROCEDURE']
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ['ORDERED', 'IN_PROGRESS', 'COMPLETED', 'CANCELLED']
      - name: priority
        tests:
          - accepted_values:
              arguments:
                values: ['STAT', 'URGENT', 'ROUTINE']

  - name: stg_healthcare__clinical_results
    description: >
      Laboratory results, vital signs, imaging reports, and pathology findings.
      Core table for clinical decision support and quality metrics.
    config:
      meta:
        contains_phi: true
        phi_fields: ['result_datetime', 'collected_datetime', 'resulted_datetime']
        owner: "clinical-data-team@company.com"
    columns:
      - name: result_id
        tests:
          - not_null
          - unique
      - name: hospital_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_healthcare__hospitals')
                field: hospital_id
      - name: result_type
        tests:
          - accepted_values:
              arguments:
                values: ['LAB', 'VITALS', 'IMAGING', 'PATHOLOGY']
      - name: result_status
        tests:
          - accepted_values:
              arguments:
                values: ['PRELIMINARY', 'FINAL', 'CORRECTED', 'CANCELLED']
      - name: abnormal_flag
        tests:
          - accepted_values:
              arguments:
                values: ['H', 'L', 'A', 'N']

  - name: stg_healthcare__vital_signs
    description: >
      Patient vital signs measurements including temperature, blood pressure,
      heart rate, respiratory rate, and oxygen saturation.
    config:
      meta:
        contains_phi: true
        phi_fields: ['measurement_datetime']
        owner: "clinical-data-team@company.com"
    columns:
      - name: vital_id
        tests:
          - not_null
          - unique
      - name: hospital_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_healthcare__hospitals')
                field: hospital_id
      - name: temperature_f
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 90
                max_value: 110
      - name: heart_rate_bpm
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 30
                max_value: 250
      - name: oxygen_saturation_pct
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 50
                max_value: 100

  - name: stg_healthcare__problem_list
    description: >
      Active and historical patient diagnoses beyond encounters.
      Tracks chronic conditions and ongoing health issues.
    config:
      meta:
        contains_phi: true
        phi_fields: ['onset_date', 'resolution_date']
        owner: "clinical-data-team@company.com"
    columns:
      - name: problem_id
        tests:
          - not_null
          - unique
      - name: hospital_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_healthcare__hospitals')
                field: hospital_id
      - name: problem_status
        tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'RESOLVED', 'INACTIVE']

  - name: stg_healthcare__medication_administration
    description: >
      Actual medication administration records (MAR).
      Documents when medications were given, held, or refused.
    config:
      meta:
        contains_phi: true
        phi_fields: ['scheduled_datetime', 'administered_datetime']
        owner: "clinical-data-team@company.com"
    columns:
      - name: admin_id
        tests:
          - not_null
          - unique
      - name: hospital_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_healthcare__hospitals')
                field: hospital_id
      - name: administration_status
        tests:
          - accepted_values:
              arguments:
                values: ['GIVEN', 'REFUSED', 'HELD', 'MISSED']

  - name: stg_healthcare__patient_allergies
    description: >
      Patient allergy and adverse reaction history.
      Critical for medication safety and clinical decision support.
    config:
      meta:
        contains_phi: true
        phi_fields: ['onset_date', 'resolution_date']
        owner: "clinical-data-team@company.com"
    columns:
      - name: allergy_id
        tests:
          - not_null
          - unique
      - name: hospital_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_healthcare__hospitals')
                field: hospital_id
      - name: allergen_type
        tests:
          - accepted_values:
              arguments:
                values: ['DRUG', 'FOOD', 'ENVIRONMENTAL']
      - name: severity
        tests:
          - accepted_values:
              arguments:
                values: ['MILD', 'MODERATE', 'SEVERE', 'LIFE_THREATENING']

  - name: stg_healthcare__patient_coverage
    description: >
      Patient insurance coverage and benefit information.
      Tracks deductibles, out-of-pocket maximums, and coverage periods.
    config:
      meta:
        contains_phi: true
        phi_fields: ['policy_number', 'subscriber_id', 'subscriber_name']
        owner: "financial-analytics@company.com"
    columns:
      - name: coverage_id
        tests:
          - not_null
          - unique
      - name: hospital_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_healthcare__hospitals')
                field: hospital_id
      - name: coverage_status
        tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'TERMINATED', 'SUSPENDED']
      - name: plan_type
        tests:
          - accepted_values:
              arguments:
                values: ['HMO', 'PPO', 'EPO', 'POS']

  - name: stg_healthcare__sdoh_screenings
    description: >
      Social Determinants of Health (SDOH) screening data.
      Captures housing, food security, transportation, and social support needs.
    config:
      meta:
        contains_phi: true
        phi_fields: ['screening_date']
        owner: "population-health-team@company.com"
    columns:
      - name: screening_id
        tests:
          - not_null
          - unique
      - name: hospital_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_healthcare__hospitals')
                field: hospital_id
      - name: sdoh_risk_category
        tests:
          - accepted_values:
              arguments:
                values: ['No Risk', 'Low Risk', 'Medium Risk', 'High Risk']
      - name: total_sdoh_risk_count
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 7

  - name: stg_healthcare__care_plans
    description: >
      ⚠️ PHI WARNING: Nursing care plans and interventions.
      Contains: Patient linkage, care plan dates
    config:
      meta:
        contains_phi: true
        phi_fields: [ 'start_date', 'target_date', 'completion_date' ]
    columns:
      - name: care_plan_id
        tests: [ not_null, unique ]
      - name: hospital_id
        description: "🔒 CRITICAL for RLS"
        tests: [ not_null ]

  - name: stg_healthcare__prior_authorizations
    description: >
      Prior authorization tracking for services and medications.
      Contains: Authorization numbers, clinical justification
    config:
      meta:
        contains_phi: false
    columns:
      - name: auth_id
        tests: [ not_null, unique ]
      - name: hospital_id
        description: "🔒 CRITICAL for RLS"
        tests: [ not_null ]

  - name: stg_healthcare__quality_measures
    description: >
      CMS Core Measures and quality metric tracking.
      Contains: Measure performance, timing metrics
    config:
      meta:
        contains_phi: false
    columns:
      - name: measure_id
        tests: [ not_null, unique ]
      - name: hospital_id
        description: "🔒 CRITICAL for RLS"
        tests: [ not_null ]

  - name: stg_healthcare__referrals
    description: >
      Outpatient referrals and care coordination tracking.
      Contains: Referral dates, provider information
    config:
      meta:
        contains_phi: false
    columns:
      - name: referral_id
        tests: [ not_null, unique ]
      - name: hospital_id
        description: "🔒 CRITICAL for RLS"
        tests: [ not_null ]