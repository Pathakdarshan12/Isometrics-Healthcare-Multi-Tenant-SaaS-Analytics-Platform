version: 2

sources:
  - name: healthcare
    description: >
      Raw healthcare data from hospital EMR systems.
      ⚠️ Contains PHI - Access restricted and logged per HIPAA requirements.

    database: isometrics_dev
    schema: raw_phi

    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: { count: 4, period: hour }
        error_after: { count: 6, period: hour }

    tables:
      - name: raw_hospitals
        description: "Hospital master data (tenants)"
        config:
          meta:
            contains_phi: false
        columns:
          - name: hospital_id
            description: "🔒 Unique hospital identifier (tenant_id)"
            tests:
              - not_null
              - unique
          - name: hospital_name
            tests:
              - not_null
          - name: contract_tier
            tests:
              - accepted_values:
                  arguments:
                    values: ['Basic', 'Advanced', 'Enterprise']

      - name: raw_patients
        description: >
          ⚠️ PHI WARNING: Patient demographics
          Contains: MRN, Names, DOB, Zip Code
          Access: Restricted to authorized personnel only
        config:
          meta:
            contains_phi: true
            phi_fields: ['mrn', 'first_name', 'last_name', 'date_of_birth', 'zip_code']
        columns:
          - name: patient_id
            description: "De-identified patient ID"
            tests:
              - not_null
              - unique
          - name: hospital_id
            description: "🔒 CRITICAL: Hospital identifier for RLS"
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('healthcare', 'raw_hospitals')
                    field: hospital_id
          - name: mrn
            description: "⚠️ PHI: Medical Record Number"
          - name: date_of_birth
            description: "⚠️ PHI: Patient date of birth"

      - name: raw_providers
        description: "Provider roster - physicians, nurses, specialists"
        config:
          meta:
            contains_phi: false
        columns:
          - name: provider_id
            tests:
              - not_null
              - unique
          - name: hospital_id
            description: "🔒 CRITICAL for RLS"
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('healthcare', 'raw_hospitals')
                    field: hospital_id
          - name: npi
            description: "National Provider Identifier"
            tests:
              - not_null

      - name: raw_facilities
        description: "Facility/department master data"
        columns:
          - name: facility_id
            tests:
              - not_null
              - unique
          - name: hospital_id
            description: "🔒 CRITICAL for RLS"
            tests:
              - not_null

      - name: raw_encounters
        description: >
          ⚠️ PHI WARNING: Patient encounters (admissions/visits)
          Contains: Patient linkage, dates of service
        config:
          meta:
            contains_phi: true
            phi_fields: ['patient_id', 'admission_date', 'discharge_date']
        columns:
          - name: encounter_id
            tests:
              - not_null
              - unique
          - name: hospital_id
            description: "🔒 CRITICAL for RLS"
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('healthcare', 'raw_hospitals')
                    field: hospital_id
          - name: patient_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('healthcare', 'raw_patients')
                    field: patient_id
          - name: admission_date
            tests:
              - not_null
          - name: encounter_type
            tests:
              - accepted_values:
                  arguments:
                    values: ['Inpatient', 'Outpatient', 'Emergency', 'Observation']

      - name: raw_billing_transactions
        description: "Billing and payment transactions"
        config:
          meta:
            contains_phi: false  # Financial data only
        columns:
          - name: transaction_id
            tests:
              - not_null
              - unique
          - name: hospital_id
            description: "🔒 CRITICAL for RLS"
            tests:
              - not_null