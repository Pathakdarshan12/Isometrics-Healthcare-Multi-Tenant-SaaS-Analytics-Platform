name: dbt Production Deployment
on:
  # Deploy only after CI has passed on main
  workflow_run:
    workflows: ["dbt CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Full refresh models'
        required: false
        type: boolean
        default: false

# Never overlap with a scheduled pipeline run (pipeline_schedule.yml)
concurrency:
  group: snowflake-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      # optional; the Slack steps are skipped when the secret is not set
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
        with:
          # Deploy exactly the commit CI tested
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: pip install dbt-snowflake==1.11.0

      - name: 🔧 Setup dbt profile (key-pair auth)
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PROD_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.dbt ~/.snowflake
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8
          cat <<EOF > ~/.dbt/profiles.yml
          isometrics_healthcare:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_PROD_USER }}
                private_key_path: $HOME/.snowflake/rsa_key.p8
                role: DBT_PROD_ROLE
                database: ISOMETRICS_PROD
                warehouse: DBT_PROD_WH
                # layers build into DBT_PROD_STAGING / DBT_PROD_MARTS (like DBT_DEV_* in dev)
                schema: DBT_PROD
                threads: 8
                query_tag: dbt_prod_deploy
          EOF

      - name: 🔧 Verify production connection
        run: cd isometrics_healthcare && dbt debug

      - name: Install dbt packages
        run: |
          cd isometrics_healthcare
          dbt deps

      - name: 🔒 Setup RLS policies
        run: |
          cd isometrics_healthcare
          dbt run-operation setup_rls_policies

      - name: 🧪 Pre-deployment tests
        run: |
          cd isometrics_healthcare
          dbt test --select source:*

      - name: 🚀 Deploy staging models
        run: |
          cd isometrics_healthcare
          dbt run --select staging ${{ github.event.inputs.full_refresh == 'true' && '--full-refresh' || '' }}

      - name: 🚀 Deploy intermediate models
        run: |
          cd isometrics_healthcare
          dbt run --select intermediate

      - name: 🚀 Deploy marts (incremental)
        run: |
          cd isometrics_healthcare
          dbt run --select marts ${{ github.event.inputs.full_refresh == 'true' && '--full-refresh' || '' }}

      - name: 📸 Snapshot execution
        run: |
          cd isometrics_healthcare
          dbt snapshot

      - name: 🧪 Post-deployment data quality tests
        run: |
          cd isometrics_healthcare
          dbt test --exclude assert_rls_column_exists assert_rls_policy_applied

      - name: 🔒 Verify RLS policies applied
        run: |
          cd isometrics_healthcare
          dbt test --select assert_rls_policy_applied assert_rls_column_exists

      - name: 🔒 Verify data isolation
        run: |
          cd isometrics_healthcare
          dbt test --select assert_no_cross_hospital_data_leakage assert_no_cross_hospital_encounters

      - name: 📊 Generate production docs
        run: |
          cd isometrics_healthcare
          dbt docs generate

      - name: 📤 Upload production manifest
        uses: actions/upload-artifact@v4
        with:
          name: prod-dbt-manifest
          path: |
            isometrics_healthcare/target/manifest.json
            isometrics_healthcare/target/catalog.json
            isometrics_healthcare/target/run_results.json

      - name: 📈 Report production object counts
        run: cd isometrics_healthcare && dbt run-operation report_layer_counts

      - name: 🔔 Slack notification on success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Production deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Complete*\n\n✅ All models deployed successfully\n📊 Commit: `${{ github.sha }}`\n👤 By: ${{ github.actor }}"
                  }
                }
              ]
            }

      - name: 🔔 Slack notification on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Production deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Failed*\n\n❌ Deployment encountered errors\n📊 Commit: `${{ github.sha }}`\n👤 By: ${{ github.actor }}\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-deployment-logs
          path: |
            isometrics_healthcare/target/run_results.json
            isometrics_healthcare/logs/dbt.log