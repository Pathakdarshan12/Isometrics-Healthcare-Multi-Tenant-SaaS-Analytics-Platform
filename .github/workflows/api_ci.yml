name: API CI
on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api_ci.yml']
  pull_request:
    branches: [main]
    paths: ['api/**', '.github/workflows/api_ci.yml']

jobs:
  test:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: 🧪 Run tests (offline; no Snowflake needed)
        run: python -m pytest api/tests -v
