name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dbt-ci:
    name: dbt CI Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake==1.7.0 dbt-core==1.7.0
      
      - name: 🔧 Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          isometrics_healthcare:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: DBT_CI_ROLE
                database: ISOMETRICS_CI
                warehouse: DBT_CI_WH
                schema: dbt_ci_pr_${{ github.event.pull_request.number }}
                threads: 4
          EOF
      
      - name: 📚 Install dbt packages
        run: |
          cd isometrics_healthcare
          dbt deps
      
      - name: ✅ dbt compile (syntax check)
        run: |
          cd isometrics_healthcare
          dbt compile
      
      - name: 🏗️ dbt run (build changed models - Slim CI)
        run: |
          cd isometrics_healthcare
          dbt run --select state:modified+ --defer --state ./prod_state || true
      
      - name: 🧪 dbt test (test changed models)
        run: |
          cd isometrics_healthcare
          dbt test --select state:modified+ || true
      
      - name: 🔒 Verify RLS on all marts
        run: |
          cd isometrics_healthcare
          dbt test --select test_name:assert_rls_column_exists
          dbt test --select test_name:assert_no_cross_hospital_encounters
      
      - name: ⚕️ Check for PHI in logs
        run: |
          cd isometrics_healthcare
          # Scan logs for potential PHI patterns
          if grep -rE '\b[0-9]{3}-[0-9]{2}-[0-9]{4}\b' target/; then
            echo "❌ POTENTIAL SSN DETECTED IN LOGS!"
            exit 1
          fi
          echo "✅ No PHI patterns detected in logs"
      
      - name: 📊 Generate dbt docs
        run: |
          cd isometrics_healthcare
          dbt docs generate

      - name: 🧹 Cleanup CI schema
        if: always()
        run: |
          cd isometrics_healthcare
          # Drop the CI schema after tests complete
          dbt run-operation drop_schema --args "{schema_name: dbt_ci_pr_${{ github.event.pull_request.number}}}" || true