name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dbt-ci:
    name: dbt CI Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dbt
        run: |
          pip install dbt-snowflake==1.11.0
      
      - name: 🔧 Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          isometrics_healthcare:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: DBT_CI_ROLE
                database: ISOMETRICS_CI
                warehouse: DBT_CI_WH
                schema: dbt_ci_${{ github.event.pull_request.number || github.run_id }}
                threads: 4
          EOF
      
      - name: Install dbt packages
        run: |
          cd isometrics_healthcare
          dbt deps
      
      - name: dbt compile (syntax check)
        run: |
          cd isometrics_healthcare
          dbt compile

      - name: dbt run (build changed models)
        run: |
          cd isometrics_healthcare
          dbt run

      - name: dbt test (test changed models)
        run: |
          cd isometrics_healthcare
          dbt test
      
      - name: Verify RLS on all marts
        run: |
          cd isometrics_healthcare
          dbt test --select test_name:assert_rls_column_exists
          dbt test --select test_name:assert_no_cross_hospital_encounters

      - name: Generate dbt docs
        run: |
          cd isometrics_healthcare
          dbt docs generate

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-test-results
          path: isometrics_healthcare/target/run_results.json

      - name: 🧹 Cleanup CI schema
        if: always()
        run: |
          cd isometrics_healthcare
          # Drop the CI schema after tests complete
          dbt run-operation drop_schema --args "{schema_name: dbt_ci_pr_${{ github.event.pull_request.number}}}" || true