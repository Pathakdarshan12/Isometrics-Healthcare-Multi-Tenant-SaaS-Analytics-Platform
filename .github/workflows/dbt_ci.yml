name: dbt CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  dbt-ci:
    name: dbt CI Tests
    runs-on: ubuntu-latest
    env:
      CI_SCHEMA: dbt_ci_${{ github.event.pull_request.number || github.run_id }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: |
          pip install dbt-snowflake==1.11.0

      - name: Install SnowSQL
        run: |
          curl -sSLo snowsql.bash https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/1.2/linux_x86_64/snowsql-1.2.32-linux_x86_64.bash
          SNOWSQL_DEST=~/bin SNOWSQL_LOGIN_SHELL=~/.profile bash snowsql.bash
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Verify SnowSQL installation
        run: |
          ~/bin/snowsql -v

      - name: 🔧 Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          isometrics_healthcare:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: DBT_CI_ROLE
                database: ISOMETRICS_CI
                warehouse: DBT_CI_WH
                schema: ${{ env.CI_SCHEMA }}
                threads: 4
          EOF

      - name: 🔧 Setup CI environment (create schemas)
        run: |
          cd isometrics_healthcare
          cat <<EOF > setup_ci.sql
          USE ROLE DBT_CI_ROLE;
          USE WAREHOUSE DBT_CI_WH;
          USE DATABASE ISOMETRICS_CI;
          CREATE SCHEMA IF NOT EXISTS RAW_PHI;
          CREATE SCHEMA IF NOT EXISTS STAGING;
          CREATE SCHEMA IF NOT EXISTS MARTS;
          CREATE SCHEMA IF NOT EXISTS SNAPSHOTS;
          CREATE SCHEMA IF NOT EXISTS ${{ env.CI_SCHEMA }};
          EOF
          
          ~/bin/snowsql -a ${{ secrets.SNOWFLAKE_ACCOUNT }} \
                  -u ${{ secrets.SNOWFLAKE_USER }} \
                  -o log_level=DEBUG \
                  -f setup_ci.sql
        env:
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}

      - name: Install dbt packages
        run: |
          cd isometrics_healthcare
          dbt deps

      - name: 🔒 Apply RLS policies
        run: |
          cd isometrics_healthcare
          dbt run-operation setup_rls_policies


      - name: dbt compile
        run: |
          cd isometrics_healthcare
          dbt compile

      - name: dbt run
        run: |
          cd isometrics_healthcare
          dbt run

      - name: dbt test
        run: |
          cd isometrics_healthcare
          dbt test

      - name: Verify RLS on all marts
        run: |
          cd isometrics_healthcare
          dbt test --select test_name:assert_rls_column_exists
          dbt test --select test_name:assert_no_cross_hospital_encounters

      - name: Generate dbt docs
        run: |
          cd isometrics_healthcare
          dbt docs generate

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-test-results
          path: isometrics_healthcare/target/run_results.json

      - name: 🧹 Cleanup CI environment (drop schema)
        if: always()
        run: |
          cd isometrics_healthcare
          cat <<EOF > cleanup_ci.sql
          USE ROLE DBT_CI_ROLE;
          DROP SCHEMA IF EXISTS ISOMETRICS_CI.${{ env.CI_SCHEMA }} CASCADE;
          EOF
          
          ~/bin/snowsql -a ${{ secrets.SNOWFLAKE_ACCOUNT }} \
                  -u ${{ secrets.SNOWFLAKE_USER }} \
                  -o log_level=DEBUG \
                  -f cleanup_ci.sql || true
        env:
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}