name: dbt CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per PR at a time: a new push cancels the previous run (cleanup still runs)
concurrency:
  group: dbt-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  dbt-ci:
    name: dbt CI Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # "Comment PR with results" step
      issues: write
    env:
      CI_SCHEMA: dbt_ci_${{ github.event.pull_request.number || github.run_id }}
      # CI's own database holds only per-run schemas, so sources read dev raw data
      DBT_RAW_DATABASE: ISOMETRICS_DEV

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        # pin dbt-core: dbt-snowflake allows dbt-core>=1.10.0rc0, so pip would pick pre-release dbt v2
        run: pip install dbt-core==1.11.2 dbt-snowflake==1.11.0

      - name: 🔧 Setup dbt profile (key-pair auth)
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.dbt ~/.snowflake
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8
          cat <<EOF > ~/.dbt/profiles.yml
          isometrics_healthcare:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                private_key_path: $HOME/.snowflake/rsa_key.p8
                role: DBT_CI_ROLE
                database: ISOMETRICS_CI
                warehouse: DBT_CI_WH
                schema: ${{ env.CI_SCHEMA }}
                threads: 4
                query_tag: dbt_ci
          EOF

      - name: Install dbt packages
        run: cd isometrics_healthcare && dbt deps

      - name: dbt debug
        run: cd isometrics_healthcare && dbt debug

      # Creates ISOMETRICS_CI.RAW_PHI/AUDIT, the policies and the CI test mappings
      - name: 🔒 Setup RLS policies (before dbt run)
        run: cd isometrics_healthcare && dbt run-operation setup_rls_policies

      - name: dbt run (staging)
        run: cd isometrics_healthcare && dbt run --select staging

      - name: dbt run (intermediate)
        run: cd isometrics_healthcare && dbt run --select intermediate

      - name: dbt run (marts)
        run: cd isometrics_healthcare && dbt run --select marts

      - name: dbt test (data quality)
        run: cd isometrics_healthcare && dbt test --exclude assert_rls_column_exists assert_rls_policy_applied

      - name: Verify RLS policies
        run: cd isometrics_healthcare && dbt test --select assert_rls_column_exists assert_rls_policy_applied

      - name: Verify data isolation
        run: cd isometrics_healthcare && dbt test --select assert_no_cross_hospital_data_leakage assert_no_cross_hospital_encounters

      - name: Generate dbt docs
        run: cd isometrics_healthcare && dbt docs generate

      - name: Upload docs artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            isometrics_healthcare/target/manifest.json
            isometrics_healthcare/target/catalog.json
            isometrics_healthcare/target/index.html

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-test-results
          path: |
            isometrics_healthcare/target/run_results.json
            isometrics_healthcare/logs/dbt.log

      # Drops <CI_SCHEMA> and every <CI_SCHEMA>_* layer schema (detaching their policies)
      - name: 🧹 Cleanup CI schemas
        if: always()
        run: cd isometrics_healthcare && (dbt run-operation drop_ci_schemas || echo "CI schema cleanup failed, continuing...")

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ dbt CI tests failed. Check the workflow logs for details.'
            })
