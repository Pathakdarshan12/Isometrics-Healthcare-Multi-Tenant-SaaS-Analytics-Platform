name: Pipeline CI
on:
  push:
    branches: [main]
    paths: ['orchestration/**', 'data_generation/**', 'utils/**', 'scripts/isometrics_healthcare_snowflake_setup.sql', '.github/workflows/pipeline_ci.yml']
  pull_request:
    branches: [main]
    paths: ['orchestration/**', 'data_generation/**', 'utils/**', 'scripts/isometrics_healthcare_snowflake_setup.sql', '.github/workflows/pipeline_ci.yml']

jobs:
  test:
    name: Pipeline tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestration/requirements.txt

      - name: Install dependencies
        run: pip install -r orchestration/requirements.txt sqlglot==28.5.0

      - name: 🧪 Run tests (offline; no Snowflake needed)
        run: python -m pytest data_generation/tests orchestration/tests -v
